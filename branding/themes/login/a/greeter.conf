# KkomiOS 로그인 테마 A — kkomios-login-theme 명령이 /etc/lightdm/lightdm-gtk-greeter.conf 로 복사함
[greeter]
theme-name = KkomiOS-Login-A
background = /usr/share/kkomios/login/a/background.png
user-background = false
default-user-image = /usr/share/kkomios/login/a/avatar.png
round-user-image = true
font-name = Nunito 12
position = 70%,center 50%,center
panel-position = top
clock-format = %H:%M
indicators = ~host;~spacer;~clock;~spacer;~session;~power
transition-type = none
