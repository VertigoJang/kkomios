# KkomiOS 로그인 테마 B — kkomios-login-theme 명령이 /etc/lightdm/lightdm-gtk-greeter.conf 로 복사함
[greeter]
theme-name = KkomiOS-Login-B
background = /usr/share/kkomios/login/b/background.png
user-background = false
default-user-image = /usr/share/kkomios/login/b/avatar.png
round-user-image = true
font-name = Nunito 12
position = 50%,center 50%,center
panel-position = top
clock-format = %H:%M
indicators = ~spacer;~clock;~spacer;~a11y;~power
transition-type = none
